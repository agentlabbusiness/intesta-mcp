[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "intesta-mcp"
version = "0.1.0"
description = "MCP server for the Intesta trust registry: let an agent check a domain's A0-A4 trust level and verified facts before it acts."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "DC ESCRYPT SL", email = "contact@intesta.io" }]
keywords = ["mcp", "trust", "registry", "ai-agents", "attestation", "verification"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries",
]
dependencies = ["mcp>=1.2,<2", "httpx>=0.27"]

[project.urls]
Homepage = "https://intesta.io"
Source = "https://github.com/agentlabbusiness/intesta-mcp"

[project.scripts]
intesta-mcp = "intesta_mcp.server:main"

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
